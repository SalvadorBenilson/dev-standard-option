# ==== Vanguard IT — docker-compose genérico para desenvolvimento local ====
# Ajuste o serviço "app" à stack real e adicione os serviços de apoio
# necessários (base de dados, cache, fila).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # cache:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"

volumes:
  db_data:
