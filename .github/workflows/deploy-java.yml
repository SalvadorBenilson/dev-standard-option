# Deploy para projectos Java (Maven ou Gradle). Apague este ficheiro se o
# projecto não usar Java.
name: Deploy (Java)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Build (Maven)
        if: hashFiles('pom.xml') != ''
        run: mvn -B clean package -DskipTests=false

      - name: Build (Gradle)
        if: hashFiles('build.gradle*') != ''
        run: ./gradlew build

      - name: Deploy via SSH (copiar .jar e reiniciar serviço)
        if: false # active após configurar os secrets abaixo
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no target/*.jar \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/app.jar"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo systemctl restart app"

      - name: Health check pós-deploy
        if: false
        run: bash scripts/server/health-check.sh "${{ secrets.APP_URL }}"
