# Deploy para projectos Go. Apague este ficheiro se o projecto não usar Go.
name: Deploy (Go)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/app ./...

      - name: Deploy via SSH (copiar binário e reiniciar serviço)
        if: false # active após configurar os secrets abaixo
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no bin/app \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/app"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo systemctl restart app"

      - name: Health check pós-deploy
        if: false
        run: bash scripts/server/health-check.sh "${{ secrets.APP_URL }}"
