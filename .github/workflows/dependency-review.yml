# Bloqueia PRs que introduzam dependências com vulnerabilidades conhecidas
# ou licenças incompatíveis. Funciona para qualquer ecossistema suportado
# pelo GitHub Dependency Graph.
name: Dependency Review

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
